<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Chatbot</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    </head>


	<body>
		<div class="container-fluid h-100">
			<div class="row justify-content-center h-100">		
				<div class="col-md-8 col-xl-6 chat">
					<div class="card">
						<div class="card-header msg_head">
							<div class="d-flex bd-highlight">
								<div class="img_cont">
									<!-- <img src="https://i.ibb.co/fSNP7Rz/icons8-chatgpt-512.png" class="rounded-circle user_img"> -->
									<img src="https://static.vecteezy.com/system/resources/previews/016/017/018/non_2x/ecommerce-icon-free-png.png" class="rounded-circle user_img">
									<span class="online_icon"></span>
								</div>
								<div class="user_info">
									<span>Flipkart Chatbot</span>
									<p>Ask me anything!</p>
								</div>
							</div>
						</div>
						<div id="messageFormeight" class="card-body msg_card_body">
							
							
						</div>
						<div class="card-footer">
							<form id="messageArea" class="input-group">
                                <input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off" class="form-control type_msg" required/>
								<div class="input-group-append">
									<button type="submit" id="send" class="input-group-text send_btn"><i class="fas fa-location-arrow"></i></button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
		
		<script>
$(document).ready(function () {
    const sessionId = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : String(Date.now()) + Math.random();
    const BOT_IMG = "https://static.vecteezy.com/system/resources/previews/016/017/018/non_2x/ecommerce-icon-free-png.png";
    const USER_IMG = "https://i.ibb.co/d5b84Xw/Untitled-design.png";

    function timeNow() {
        return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function addMessage(text, isUser) {
        const bubble = $("<div>")
            .addClass(isUser ? "msg_cotainer_send" : "msg_cotainer")
            .text(text)
            .append($("<span>").addClass(isUser ? "msg_time_send" : "msg_time").text(timeNow()));
        const avatar = $("<div>").addClass("img_cont_msg")
            .append($("<img>").attr("src", isUser ? USER_IMG : BOT_IMG)
                              .addClass("rounded-circle user_img_msg"));
        const row = $("<div>").addClass("d-flex mb-4")
            .addClass(isUser ? "justify-content-end" : "justify-content-start")
            .append(isUser ? [bubble, avatar] : [avatar, bubble]);
        const box = $("#messageFormeight");
        box.append(row);
        box.scrollTop(box[0].scrollHeight);
    }

    $("#messageArea").on("submit", function (event) {
        event.preventDefault();
        const rawText = $("#text").val().trim();
        if (!rawText) return;

        addMessage(rawText, true);
        $("#text").val("");
        $("#send").prop("disabled", true);

        $.ajax({
            type: "POST",
            url: "/ask",
            data: { msg: rawText, session_id: sessionId }
        }).done(function (data) {
            addMessage(data.answer, false);
        }).fail(function () {
            addMessage("Sorry, something went wrong. Please try again.", false);
        }).always(function () {
            $("#send").prop("disabled", false);
            $("#text").focus();
        });
    });
});
</script>
        
    </body>
</html>
